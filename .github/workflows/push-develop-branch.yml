name: Deploy develop or uat branch to its org

on:
    push:
      branches: [ develop, uat ]
      paths:
        - 'force-app/**'

permissions:
    contents: read

jobs:
    deploy-develop-branch-to-dev-org:
        runs-on: ubuntu-latest
        if: ${{ github.actor != 'dependabot[bot]' }}

        environment: ${{ github.ref_name == 'uat' && 'uat' || 'dev' }}

        env:
          TARGET_ORG: ${{ github.ref_name == 'uat' && 'uat' || 'dev' }}

        steps:
            - name: 'Checkout source code'
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: 'Resolve the commit range being deployed'
              env:
                EVENT_BEFORE: ${{ github.event.before }}
              run: |
                  if git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
                    DELTA_FROM="$EVENT_BEFORE"
                  else
                    echo "::notice::${EVENT_BEFORE} is not a reachable commit (new branch or force push); falling back to HEAD^"
                    DELTA_FROM=$(git rev-parse HEAD^)
                  fi
                  DELTA_TO=$(git rev-parse HEAD)
                  echo "DELTA_FROM=$DELTA_FROM" >> $GITHUB_ENV
                  echo "DELTA_TO=$DELTA_TO" >> $GITHUB_ENV

                  BT='`'

                  {
                    echo "## Deploying ${BT}${GITHUB_REF_NAME}${BT} to the ${TARGET_ORG} org"
                    echo
                    echo "Destructive changes computed over ${BT}${DELTA_FROM}..${DELTA_TO}${BT}."
                    echo
                    echo "### Commits in this push"
                    echo
                    echo '```'
                    git log --oneline --no-decorate "$DELTA_FROM..$DELTA_TO"
                    echo '```'
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: 'Install Node.js'
              uses: actions/setup-node@v7
              with:
                node-version: '22'

            - name: 'Install Salesforce CLI'
              run: |
                  npm install --global @salesforce/cli@latest
                  node --version
                  sf --version

            - name: 'Installing sfdx git delta'
              run: |
                  echo y | sf plugins install sfdx-git-delta@latest
                  sf plugins

            - name: 'Populate auth file with SFDX_URL secret of the target org'
              shell: bash
              env:
                SFDX_INTEGRATION_URL: ${{ secrets.SFDX_INTEGRATION_URL }}
              run: |
                  echo "$SFDX_INTEGRATION_URL" > ./SFDX_INTEGRATION_URL.txt

            - name: 'Authenticate to the target org'
              run: sf org login sfdx-url --sfdx-url-file ./SFDX_INTEGRATION_URL.txt --set-default --alias "$TARGET_ORG"

            - name: 'Create delta packages for new, modified or deleted metadata'
              run: |
                  mkdir changed-sources
                  sf sgd source delta --to "$DELTA_TO" --from "$DELTA_FROM" --output-dir changed-sources/ --generate-delta --source-dir force-app/

            - name: 'Deploy the delta to the target org'
              run: sf project deploy start --source-dir "changed-sources/force-app" --test-level RunLocalTests --wait 60 --verbose

            - name: 'Deploy destructive changes (if any) to the target org'
              run: sf project deploy start --metadata-dir "changed-sources/destructiveChanges" --dry-run --ignore-warnings --verbose
