name: Validate PR on develop branch

on:
    pull_request:
      types: [opened, synchronize]
      branches: [ develop, uat ]
      paths:
        - 'force-app/**'

permissions:
    contents: read
    security-events: write
    actions: read

jobs:
    validate-deployment-on-develop-org:
        runs-on: ubuntu-latest
        if: ${{ github.actor != 'dependabot[bot]' }}

        environment: dev

        steps:
            - name: 'Checkout source code'
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: 'Resolve the commit range being validated'
              env:
                PR_NUMBER: ${{ github.event.pull_request.number }}
                BASE_REF: ${{ github.event.pull_request.base.ref }}
                HEAD_REF: ${{ github.event.pull_request.head.ref }}
                HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  DELTA_FROM=$(git rev-parse HEAD^)
                  DELTA_TO=$(git rev-parse HEAD)
                  echo "DELTA_FROM=$DELTA_FROM" >> $GITHUB_ENV
                  echo "DELTA_TO=$DELTA_TO" >> $GITHUB_ENV

                  BT='`'

                  {
                    echo "## Validating PR #${PR_NUMBER}: ${BT}${HEAD_REF}${BT} into ${BT}${BASE_REF}${BT}"
                    echo
                    echo "|  | Ref | Commit |"
                    echo "|---|---|---|"
                    echo "| **From** (base branch tip) | ${BT}${BASE_REF}${BT} | ${BT}${DELTA_FROM}${BT} |"
                    echo "| **To** (PR head) | ${BT}${HEAD_REF}${BT} | ${BT}${HEAD_SHA}${BT} |"
                    echo
                    echo "Delta diffed over ${BT}${DELTA_FROM}..${DELTA_TO}${BT}, where ${DELTA_TO} is the PR merge commit."
                    echo
                    echo "### Commits in this PR"
                    echo
                    echo '```'
                    git log --oneline --no-decorate "$DELTA_FROM..$DELTA_TO"
                    echo '```'
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: 'Install Node.js'
              uses: actions/setup-node@v7
              with:
                node-version: '22'

            - name: 'Install Java'
              uses: actions/setup-java@v6
              with:
                distribution: 'temurin'
                java-version: '21'

            - name: 'Read PR Body'
              env:
                PR_BODY: ${{ github.event.pull_request.body }}
              run: |
                  echo "$PR_BODY" > ./pr_body.txt
                  node ./parsePR.js
                  TESTS=$(cat testsToRun.txt)
                  echo "APEX_TESTS=$TESTS" >> $GITHUB_ENV

            - name: 'Install Salesforce CLI'
              run: |
                  npm install --global @salesforce/cli@latest
                  node --version
                  sf --version

            - name: 'Installing sfdx git delta'
              run: |
                  echo y | sf plugins install sfdx-git-delta@latest
                  sf plugins

            - name: 'Installing Salesforce Code Analyzer'
              run: sf plugins install code-analyzer@latest

            - name: 'Populate auth file with SFDX_URL secret of integration org'
              shell: bash
              env:
                SFDX_INTEGRATION_URL: ${{ secrets.SFDX_INTEGRATION_URL }}
              run: |
                  echo "$SFDX_INTEGRATION_URL" > ./SFDX_INTEGRATION_URL.txt

            - name: 'Authenticate to Integration Org'
              run: sf org login sfdx-url --sfdx-url-file ./SFDX_INTEGRATION_URL.txt --set-default --alias integration

            - name: 'Create delta packages for new, modified or deleted metadata'
              run: |
                  mkdir changed-sources
                  sf sgd source delta --to "$DELTA_TO" --from "$DELTA_FROM" --output-dir changed-sources/ --generate-delta --source-dir force-app/

            - name: 'List the metadata being deployed'
              run: |
                  {
                    echo "## Metadata in this deployment"
                    echo
                    echo "### Files to deploy ($(find changed-sources/force-app -type f 2>/dev/null | wc -l))"
                    echo
                    echo '```'
                    find changed-sources/force-app -type f 2>/dev/null | sed 's|^changed-sources/||' | sort || true
                    echo '```'
                    echo
                    echo "### package.xml"
                    echo
                    echo '```xml'
                    cat changed-sources/package/package.xml 2>/dev/null || echo '(not generated)'
                    echo '```'
                    echo
                    echo "### destructiveChanges.xml"
                    echo
                    echo '```xml'
                    cat changed-sources/destructiveChanges/destructiveChanges.xml 2>/dev/null || echo '(not generated)'
                    echo '```'
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: 'Scan code'
              run: |
                  cd changed-sources
                  sf code-analyzer run --workspace './**/*.cls' --rule-selector pmd:Design --rule-selector pmd:BestPractices --rule-selector pmd:Performance --output-file 'apexScanResults.sarif'
                  cd ..

            - name: Upload SARIF file
              uses: github/codeql-action/upload-sarif@v4
              with:
                sarif_file: changed-sources/apexScanResults.sarif

            - name: 'Check-only deploy delta changes - run specified tests'
              if: ${{ env.APEX_TESTS != 'all' }}
              run: |
                  echo "Apex tests requested in the PR body: $APEX_TESTS"
                  TEST_FLAGS=""
                  for TEST_CLASS in $(echo "$APEX_TESTS" | tr ',' ' '); do
                    TEST_FLAGS="$TEST_FLAGS --tests $TEST_CLASS"
                  done
                  sf project deploy validate --source-dir "changed-sources/force-app" --test-level RunSpecifiedTests $TEST_FLAGS --verbose

            - name: 'Check-only deploy delta changes - run all tests'
              if: ${{ env.APEX_TESTS == 'all' }}
              run: |
                  sf project deploy validate --source-dir "changed-sources/force-app" --test-level RunLocalTests --verbose

            - name: 'Deploy destructive changes (if any)'
              run: sf project deploy start --metadata-dir "changed-sources/destructiveChanges" --dry-run --ignore-warnings --verbose
